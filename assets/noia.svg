<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">NOIA universe</title><desc id="d">A dark layered field representing OPTIC, WINDOW and FIELD.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09090b"/><stop offset="1" stop-color="#151016"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6b7b"/><stop offset="1" stop-color="#a88cff"/></linearGradient></defs><rect width="1200" height="430" rx="28" fill="url(#bg)"/><g opacity=".07" stroke="#ffccd2"><path d="M0 108H1200M0 216H1200M0 324H1200"/><path d="M150 0V430M300 0V430M450 0V430M600 0V430M750 0V430M900 0V430M1050 0V430"/></g><g transform="translate(74 66)"><text x="0" y="24" fill="#806b70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="4">02 / NARRATIVE SYSTEMS</text><text x="0" y="105" fill="#fff2f4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="700" letter-spacing="-3">NOIA</text><text x="0" y="156" fill="#bca7ad" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">A persistent investigative world where evidence changes what can happen next.</text><rect x="0" y="192" width="126" height="3" rx="1.5" fill="url(#a)"/><text x="0" y="244" fill="#eadbe0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">OPTIC  →  WINDOW  →  FIELD</text><text x="0" y="284" fill="#88777c" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Perception. Interpretation. Embodied action.</text></g><g transform="translate(770 62)"><rect x="28" y="32" width="292" height="272" rx="18" fill="none" stroke="#ff6b7b" stroke-opacity=".28" stroke-width="2"/><rect x="65" y="70" width="292" height="272" rx="18" fill="none" stroke="#a88cff" stroke-opacity=".3" stroke-