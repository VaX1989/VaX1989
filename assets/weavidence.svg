<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Weavidence ecosystem</title><desc id="d">A woven network representing Lab, Journey and Academy.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100f"/><stop offset="1" stop-color="#0d1717"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e6c4"/><stop offset="1" stop-color="#72b8ff"/></linearGradient></defs><rect width="1200" height="430" rx="28" fill="url(#bg)"/><g opacity=".08" stroke="#bdf6e8"><path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200M0 360H1200"/><path d="M120 0V430M240 0V430M360 0V430M480 0V430M600 0V430M720 0V430M840 0V430M960 0V430M1080 0V430"/></g><g transform="translate(74 66)"><text x="0" y="24" fill="#6d817d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="4">01 / EVIDENCE SYSTEMS</text><text x="0" y="105" fill="#eefbf8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="700" letter-spacing="-3">WEAVIDENCE</text><text x="0" y="156" fill="#a9bcb8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">From learning, to research design, to governed analysis.</text><rect x="0" y="192" width="126" height="3" rx="1.5" fill="url(#a)"/><text x="0" y="244" fill="#d6e3e0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">ACADEMY  →  JOURNEY  →  LAB</text><text x="0" y="284" fill="#748681" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">One ecosystem. Three surfaces. Evidence remains inspectable.</text></g><g transform="translate(760 68)" fill="none"><path d="M57 75C141 30 240 32 319 81C397 129 413 223 351 292C289 362 178 369 93 324C7 279-15 185 34 113" stroke="#67e6c4" stroke-opacity=".35" stroke-width="2"/><path d="M79