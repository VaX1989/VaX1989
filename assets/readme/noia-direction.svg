<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
<title id="title">NOIA and FIELD concept-direction plate</title>
<desc id="desc">A dark editorial concept plate for NOIA showing three intended experiential layers: OPTIC inquiry, WINDOW interpreted world and FIELD physical consequence. It is explicitly concept direction, not gameplay evidence.</desc>
<defs><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0B0C"/><stop offset="1" stop-color="#111B20"/></linearGradient><pattern id="fine" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9C9C9E" stroke-opacity=".045"/></pattern></defs>
<rect width="1440" height="640" rx="24" fill="url(#fade)"/><rect width="1440" height="640" rx="24" fill="url(#fine)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="64" y="68" font-size="13" font-weight="700" letter-spacing="3.4" fill="#6E6E72">NOIA / FIELD · VISUAL DIRECTION</text><text x="64" y="112" font-family="Georgia,'Times New Roman',serif" font-size="42" font-weight="700" fill="#E4E4E2">Evidence has to survive contact with the world.</text><text x="64" y="146" font-size="14" fill="#8D969B">Inquiry → interpretation → embodied operation → accepted consequence</text></g>
<line x1="64" y1="176" x2="1376" y2="176" stroke="#2A2A2D"/>
<g transform="translate(64 218)"><rect width="392" height="300" rx="18" fill="#0D1114" stroke="#2A2A2D"/><circle cx="196" cy="132" r="82" fill="none" stroke="#6E6E72" stroke-width="2"/><circle cx="196" cy="132" r="55" fill="none" stroke="#9C9C9E" stroke-width="1" stroke-dasharray="4 9"/><circle cx="196" cy="132" r="12" fill="#4FE0E6"/><path d="M196 36V64M292 132H264M196 228V200M100 132H128" stroke="#4FE0E6" stroke-width="2"/><text x="24" y="254" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.4" fill="#4FE0E6">OPTIC</text><text x="24" y="282" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#E4E4E2">Inquiry and continuity</text></g>
<g transform="translate(524 218)"><rect width="392" height="300" rx="18" fill="#0D1114" stroke="#2A2A2D"/><g transform="translate(42 46)" fill="none"><path d="M0 40 C72 10 125 74 196 40 S300 20 308 66" stroke="#4FE0E6" stroke-width="2"/><path d="M0 100 C66 62 125 134 196 98 S282 70 308 122" stroke="#4FE0E6" stroke-opacity=".5"/><path d="M0 154 C72 128 136 196 204 154 S282 136 308 178" stroke="#9C9C9E" stroke-opacity=".45"/><circle cx="88" cy="82" r="5" fill="#E4E4E2"/><circle cx="214" cy="68" r="5" fill="#E4E4E2"/><circle cx="154" cy="145" r="7" fill="#4FE0E6"/></g><text x="24" y="254" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.4" fill="#4FE0E6">WINDOW / EVENTWEAVE</text><text x="24" y="282" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#E4E4E2">An interpretable world</text></g>
<g transform="translate(984 218)"><rect width="392" height="300" rx="18" fill="#0D1114" stroke="#2A2A2D"/><g transform="translate(38 42)" fill="none" stroke-linecap="round"><path d="M158 18L20 188M158 18L296 188M158 18V188" stroke="#6E6E72"/><path d="M118 68H198M86 108H230M52 150H264M20 188H296" stroke="#2F5963"/><path d="M70 160L110 122L150 150L196 92L246 142" stroke="#4FE0E6" stroke-width="2.5"/><circle cx="196" cy="92" r="6" fill="#4FE0E6"/></g><text x="24" y="254" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.4" fill="#4FE0E6">FIELD</text><text x="24" y="282" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#E4E4E2">Physical consequence</text></g>
