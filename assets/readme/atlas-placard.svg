<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" role="img" aria-labelledby="title desc">
<title id="title">L'Atlante dell'Osservatore portfolio placard</title>
<desc id="desc">A museum-like editorial placard for L'Atlante dell'Osservatore, using a cathedral arch, observation axis and restrained typography. It is a portfolio presentation placard, not the book cover or evidence of publication readiness.</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5F0E5"/><stop offset="1" stop-color="#EAE1D1"/></linearGradient><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".8" fill="#1B1917" opacity=".035"/><circle cx="17" cy="15" r=".6" fill="#1B1917" opacity=".025"/></pattern></defs>
<rect width="960" height="1200" fill="url(#paper)"/><rect width="960" height="1200" fill="url(#grain)"/>
<g fill="none" stroke="#1B1917"><path d="M176 840V476C176 282 312 164 480 164S784 282 784 476V840" stroke-width="2.2" opacity=".82"/><path d="M232 840V496C232 338 342 228 480 228S728 338 728 496V840" stroke-width="1.1" opacity=".45"/><path d="M288 840V520C288 390 374 296 480 296S672 390 672 520V840" stroke-width=".8" opacity=".28"/><line x1="480" y1="124" x2="480" y2="918" stroke-width=".9" opacity=".30"/><line x1="132" y1="668" x2="828" y2="668" stroke-width=".7" opacity=".18"/><circle cx="480" cy="668" r="13" fill="#7A3426" stroke="none"/></g>
<g font-family="Arial,Helvetica,sans-serif"><text x="72" y="72" font-size="12" font-weight="700" letter-spacing="3.1" fill="#6B625B">EDITORIAL WORK / PRIVATE DEVELOPMENT</text><text x="72" y="108" font-size="11" letter-spacing="2.4" fill="#7A3426">THE OBSERVER · THE PAGE · THE ACT OF LOOKING</text></g>
<g transform="translate(72 936)"><text x="0" y="0" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="700" fill="#1B1917">L'Atlante</text><text x="0" y="62" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="700" fill="#1B1917">dell'Osservatore</text><line x1="0" y1="92" x2="816" y2="92" stroke="#7A3426" stroke-width="2"/><text x="0" y="132" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6B625B">An editorial object under active artistic refoundation.</text><text x="816" y="186" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2" fill="#6B625B">PORTFOLIO PLACARD · NOT A BOOK COVER</text></g>
</svg>