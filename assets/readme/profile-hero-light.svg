<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Pietro Corona portfolio map with Weavidence at the center</title>
<desc id="desc">Museum-like portfolio map placing Weavidence at the center, with Academy, Journey and Lab as three research paths; Elements of Population Health, editorial works, NOIA FIELD, Personae and One File Universe form a secondary constellation. This is editorial orientation, not product-state evidence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F3EA"/><stop offset="0.62" stop-color="#F0F1EA"/><stop offset="1" stop-color="#E5ECE8"/></linearGradient>
  <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8C492F"/><stop offset="0.42" stop-color="#203A3C"/><stop offset="1" stop-color="#56766F"/></linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#203A3C" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1440" height="760" rx="30" fill="url(#bg)"/><rect width="1440" height="760" rx="30" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="72" y="74" font-size="13" font-weight="700" letter-spacing="3.8" fill="#657B7C">PIETRO CORONA / PUBLIC PORTFOLIO</text><text x="72" y="108" font-size="16" letter-spacing="1.3" fill="#203A3C">PUBLIC HEALTH · EPIDEMIOLOGY · SOFTWARE &amp; AI FOR RESEARCH</text><line x1="72" y1="136" x2="1368" y2="136" stroke="#203A3C" stroke-opacity=".20"/></g>
<g transform="translate(72 182)"><text x="0" y="0" font-family="Georgia,'Times New Roman',serif" font-size="70" font-weight="700" fill="#172C2D">Weavidence</text><text x="2" y="38" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="1.6" fill="#657B7C">RESEARCH SHOULD KEEP A WAY BACK TO WHAT PRODUCED THE OUTPUT</text></g>
<path d="M110 408 C260 302 378 506 520 398 S780 292 930 398 S1180 505 1332 378" fill="none" stroke="url(#thread)" stroke-width="3.5"/><path d="M110 430 C260 536 378 334 520 442 S780 548 930 442 S1180 335 1332 462" fill="none" stroke="#203A3C" stroke-opacity=".20" stroke-width="1.5"/>
<g font-family="Arial,Helvetica,sans-serif">
  <g transform="translate(100 330)"><rect width="330" height="158" rx="18" fill="#FFFFFF" fill-opacity=".68" stroke="#203A3C" stroke-opacity=".15"/><text x="24" y="34" font-size="11" font-weight="700" letter-spacing="2.4" fill="#657B7C">01 / LEARNING</text><text x="24" y="76" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="700" fill="#203A3C">Academy</text><text x="24" y="108" font-size="15" fill="#203A3C">sources → learning → evidence</text><text x="24" y="134" font-size="12" fill="#657B7C">private · pre-production</text></g>
  <g transform="translate(555 308)"><rect width="330" height="202" rx="18" fill="#203A3C"/><text x="24" y="36" font-size="11" font-weight="700" letter-spacing="2.4" fill="#B9CECA">02 / STUDY DESIGN</text><text x="24" y="82" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="700" fill="#F7F3EA">Journey</text><text x="24" y="118" font-size="16" fill="#F7F3EA">decisions → protocol</text><text x="24" y="151" font-size="12" fill="#B9CECA">public operational application</text><circle cx="284" cy="45" r="7" fill="#E6AD88"/></g>
  <g transform="translate(1010 330)"><rect width="330" height="158" rx="18" fill="#FFFFFF" fill-opacity=".68" stroke="#203A3C" stroke-opacity=".15"/><text x="24" y="34" font-size="11" font-weight="700" letter-spacing="2.4" fill="#657B7C">03 / ANALYSIS</text><text x="24" y="76" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="700" fill="#203A3C">Lab</text><text x="24" y="108" font-size="15" fill="#203A3C">methods → results → review</text><text x="24" y="134" font-size="12" fill="#657B7C">private · active development</text></g>
</g>
<g transform="translate(72 580)" font-family="Arial,Helvetica,sans-serif"><text x="0" y="0" font-size="11" font-weight="700" letter-spacing="2.6" fill="#657B7C">CONNECTED KNOWLEDGE ESTATE</text><text x="0" y="39" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="700" fill="#172C2D">Elements of Population Health</text><text x="0" y="67" font-size="13" fill="#657B7C">21-volume population-health series · principal knowledge estate integrated with Academy</text><path d="M0 96 H520" stroke="#8C492F" stroke-width="3"/></g>
