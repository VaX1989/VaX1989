<text x="1368" y="716" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2.1" fill="#657B7C">PORTFOLIO MAP · EDITORIAL ORIENTATION · NOT PRODUCT-STATE EVIDENCE</text>
