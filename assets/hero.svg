    <stop offset="1" stop-color="#101824"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#63e6be"/>
    <stop offset=".5" stop-color="#74c0fc"/>
    <stop offset="1" stop-color="#b197fc"/>
  </linearGradient>
  <radialGradient id="glowA">
