<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-labelledby="t d">
<title id="t">Pietro Corona — Public Health, Epidemiology and AI for Research</title>
<desc id="d">Profile banner for Pietro Corona, also known as VaX1989, connecting public health, epidemiology, evidence and research software.</desc>
<defs>
