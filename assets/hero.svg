  </radialGradient>
  <radialGradient id="glowB">
    <stop stop-color="#74c0fc" stop-opacity=".14"/>
    <stop offset="1" stop-color="#74c0fc" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1800" height="620" rx="34" fill="url(#bg)"/>

